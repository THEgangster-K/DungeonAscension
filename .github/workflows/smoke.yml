name: Game smoke tests
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  syntax-and-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check game.js
      - name: Test enemy chase and hitbox geometry
        run: node --test tests/combat.test.mjs
      - name: Check website assets
        run: |
          test -s index.html
          test -s style.css
          test -s game.js
          test -s combat-math.mjs
          test -s tests/combat.test.mjs
          grep -q 'src="game.js"' index.html
          grep -q 'href="style.css"' index.html
